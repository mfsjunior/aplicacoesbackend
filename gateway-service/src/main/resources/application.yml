server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8087
          predicates:
            - Path=/api/auth/**
        - id: pessoa-service
          uri: http://pessoa-service:8082
          predicates:
            - Path=/api/pessoas/**
        - id: curso-service
          uri: http://curso-service:8083
          predicates:
            - Path=/api/cursos/**
        - id: disciplina-service
          uri: http://disciplina-service:8084
          predicates:
            - Path=/api/disciplinas/**
        - id: professor-service
          uri: http://professor-service:8085
          predicates:
            - Path=/api/professores/**
        - id: turma-service
          uri: http://turma-service:8086
          predicates:
            - Path=/api/turmas/**
        - id: matricula-service
          uri: http://matricula-service:8081
          predicates:
            - Path=/api/matriculas/**
        - id: avaliacao-service
          uri: http://avaliacao-service:8088
          predicates:
            - Path=/api/avaliacoes/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
